<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Prevyl">
  <!-- The SEAL device, distilled to favicon size: the circular emboss + a
       register cross + a nib lozenge from ui/seal.tsx, so favicon, on-result
       stamp, PDF, and OG all read as ONE instrument. Checkmark-free by design.
       CSS vars are unavailable in an icon file, so the Foundation light-theme
       token snapshot is inlined as literal hex (paper #fefcf8, accent oxblood
       #893624, accent-quiet #864b39). -->
  <rect width="32" height="32" rx="6" fill="#fefcf8" />
  <g fill="none" stroke="#893624" stroke-linecap="round">
    <!-- concentric emboss rings (outer faint, inner firm) -->
    <circle cx="16" cy="16" r="12.4" stroke="#864b39" stroke-width="1" opacity="0.55" />
    <circle cx="16" cy="16" r="9.8" stroke-width="2.1" />
    <circle cx="16" cy="16" r="3.4" stroke-width="1.2" opacity="0.7" />
    <!-- register cross — the surveyor/registry alignment mark, never a tick -->
    <line x1="16" y1="10.6" x2="16" y2="21.4" stroke-width="1.7" />
    <line x1="10.6" y1="16" x2="21.4" y2="16" stroke-width="1.7" />
  </g>
  <!-- nib lozenge — the ledger-nib monogram dot -->
  <path d="M16 14.1 l2 1.9 l-2 1.9 l-2 -1.9 z" fill="#893624" />
</svg>
